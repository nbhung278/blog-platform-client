<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Strix — Code as Craft</title>
		<meta
			name="description"
			content="Strix is a blog about software engineering, code craftsmanship, and the art of building great products."
		/>
		<meta name="robots" content="index, follow" />
		<!--
			Baseline CSP. frame-ancestors cannot be set via meta — set at the
			reverse proxy / CDN. Production index.html is what ships to S3, so
			the meta CSP here is production-only: no localhost origins. Local
			dev runs against `vite` which serves a different index from src
			and ignores this meta tag in many setups; if dev needs a relaxed
			CSP we'll inject it via Vite plugin rather than leaking it to prod.
		-->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.strix-blog.uk wss://api.strix-blog.uk; object-src 'none'; base-uri 'self'; form-action 'self'"
		/>

		<!-- Open Graph / social sharing defaults (individual pages override these) -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Strix" />
		<meta property="og:url" content="https://strix-blog.uk/" />
		<meta property="og:title" content="Strix — Code as Craft" />
		<meta
			property="og:description"
			content="A blog about software engineering, code craftsmanship, and the art of building great products."
		/>
		<!-- og:image must be PNG/JPG for FB/Twitter/LinkedIn unfurls (they reject
         SVG silently). 1200×630 JPG at ~70 KB; the SVG design source lives at
         design/og-default.svg (not deployed). -->
		<meta property="og:image" content="https://strix-blog.uk/og-default.jpg" />
		<meta property="og:image:type" content="image/jpeg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Strix — Code as Craft" />
		<meta
			name="twitter:description"
			content="A blog about software engineering, code craftsmanship, and the art of building great products."
		/>
		<meta name="twitter:image:src" content="https://strix-blog.uk/og-default.jpg" />

		<!-- Favicons. Modern browsers prefer the SVG; the .ico is for older
         clients and RSS readers (multi-size 16/32/48, ~6 KB). Apple touch
         icon is the home-screen shortcut on iOS. -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="alternate icon" href="/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!-- RSS / Atom feed discovery for readers like Feedly, NetNewsWire, etc. -->
		<link rel="alternate" type="application/atom+xml" title="Strix — Atom feed" href="/feed.atom" />
		<link rel="alternate" type="application/rss+xml" title="Strix — RSS feed" href="/feed.xml" />

		<!-- Preconnect to origins involved in the critical path so DNS/TLS happens
         in parallel with HTML parsing instead of being discovered later. -->
		<link rel="preconnect" href="https://api.strix-blog.uk" crossorigin />
		<link
			rel="preconnect"
			href="https://strix-blog-media.s3.ap-southeast-1.amazonaws.com"
			crossorigin
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!--
			Fonts: Inter (UI) + Source Serif 4 (headings + reading body).
			Playfair Display was removed; --font-serif now maps to Source Serif 4
			to avoid loading two serifs. Italic variants are not used in markup,
			so we only request roman cuts. Source Serif 4 is variable-axis (opsz),
			so a single file covers all sizes — we only need to list the weight axis.
		-->
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap"
			media="print"
			onload="this.media = 'all'"
		/>
		<noscript>
			<link
				rel="stylesheet"
				href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap"
			/>
		</noscript>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
