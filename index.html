<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Strix — Code as Craft</title>
		<meta
			name="description"
			content="Strix is a blog about software engineering, code craftsmanship, and the art of building great products."
		/>
		<meta name="robots" content="index, follow" />
		<!--
			Baseline CSP. frame-ancestors cannot be set via meta — set at the
			reverse proxy / CDN. Production index.html is what ships to S3, so
			the meta CSP here is production-only: no localhost origins. Local
			dev runs against `vite` which serves a different index from src
			and ignores this meta tag in many setups; if dev needs a relaxed
			CSP we'll inject it via Vite plugin rather than leaking it to prod.
		-->
		<!--
			img-src was previously `https:` (any HTTPS host). Tightened to the
			specific origins images actually come from:
			  - 'self' for /og-default.jpg and favicons
			  - data:/blob: for FileReader previews in the editor
			  - cdn.strix-blog.uk + the S3 bucket for user-uploaded media
			  - lh3.googleusercontent.com for Google OAuth avatars (set by
			    the backend OAuth callback; user-edited avatars are restricted
			    to S3/CDN by the backend allowlist)
			Anything else loads → CSP block → keeps a future allowlist
			regression from silently exfiltrating reader IPs via <img src>.
		-->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.strix-blog.uk https://strix-blog-media.s3.ap-southeast-1.amazonaws.com https://lh3.googleusercontent.com; font-src 'self' data:; connect-src 'self' https://api.strix-blog.uk wss://api.strix-blog.uk https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'"
		/>

		<!-- Open Graph / social sharing defaults (individual pages override these) -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Strix" />
		<meta property="og:url" content="https://strix-blog.uk/" />
		<meta property="og:title" content="Strix — Code as Craft" />
		<meta
			property="og:description"
			content="A blog about software engineering, code craftsmanship, and the art of building great products."
		/>
		<!-- og:image must be PNG/JPG for FB/Twitter/LinkedIn unfurls (they reject
         SVG silently). 1200×630 JPG at ~70 KB; the SVG design source lives at
         design/og-default.svg (not deployed). -->
		<meta property="og:image" content="https://strix-blog.uk/og-default.jpg" />
		<meta property="og:image:type" content="image/jpeg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Strix — Code as Craft" />
		<meta
			name="twitter:description"
			content="A blog about software engineering, code craftsmanship, and the art of building great products."
		/>
		<meta name="twitter:image:src" content="https://strix-blog.uk/og-default.jpg" />

		<!-- Favicons. Modern browsers prefer the SVG; the .ico is for older
         clients and RSS readers (multi-size 16/32/48, ~6 KB). Apple touch
         icon is the home-screen shortcut on iOS. -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="alternate icon" href="/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!-- RSS / Atom feed discovery for readers like Feedly, NetNewsWire, etc. -->
		<link rel="alternate" type="application/atom+xml" title="Strix — Atom feed" href="/feed.atom" />
		<link rel="alternate" type="application/rss+xml" title="Strix — RSS feed" href="/feed.xml" />

		<!-- Preconnect to origins involved in the critical path so DNS/TLS happens
         in parallel with HTML parsing instead of being discovered later.
         The legacy S3 host (strix-blog-media.s3.*.amazonaws.com) is gone —
         media now serves from cdn.strix-blog.uk (CloudFront in front of the
         same bucket), which the browser already preconnects to as a same-site
         origin via the canonical URL. -->
		<link rel="preconnect" href="https://api.strix-blog.uk" crossorigin />
		<link rel="preconnect" href="https://cdn.strix-blog.uk" crossorigin />
		<!-- Fonts are self-hosted via @fontsource-variable (Inter + Source Serif 4).
		     Preloading the two latin subsets here (before CSS is parsed) moves font
		     download off the critical chain: browser starts fetching them in parallel
		     with the JS bundle instead of waiting for CSS → @font-face discovery. -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/assets/fonts/inter-latin-wght-normal.woff2"
			crossorigin
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/assets/fonts/source-serif-4-latin-wght-normal.woff2"
			crossorigin
		/>
		<!-- latin-ext + vietnamese subsets are also on the LCP path (the home
		     page headlines + body copy mix categories that fall outside the
		     basic latin range). Preloading them avoids the 5s tail Lighthouse
		     flagged for these two fonts as render-blockers on first paint. -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/assets/fonts/source-serif-4-latin-ext-wght-normal.woff2"
			crossorigin
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/assets/fonts/source-serif-4-vietnamese-wght-normal.woff2"
			crossorigin
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/assets/fonts/inter-vietnamese-wght-normal.woff2"
			crossorigin
		/>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
