<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#ede8dd"/>

  <!-- Decorative right band -->
  <rect x="900" y="0" width="300" height="630" fill="#8b5e3c"/>

  <!-- Logo tile -->
  <rect x="80" y="80" width="100" height="100" rx="16" fill="#8b5e3c"/>
  <text x="130" y="155" font-family="Georgia, 'Source Serif 4', serif" font-size="64" font-weight="700" fill="#fff" text-anchor="middle">S</text>

  <!-- Site name -->
  <text x="200" y="155" font-family="Georgia, 'Source Serif 4', serif" font-size="56" font-weight="700" fill="#3d2b1f">Strix</text>

  <!-- Tagline -->
  <text x="80" y="360" font-family="Georgia, 'Source Serif 4', serif" font-size="92" font-weight="700" fill="#3d2b1f">Code as Craft</text>
  <text x="80" y="430" font-family="Georgia, 'Source Serif 4', serif" font-size="34" font-weight="400" fill="#6b4c35" font-style="italic">software engineering · craftsmanship · the art of building</text>

  <!-- Footer URL -->
  <text x="80" y="560" font-family="-apple-system, 'Inter', sans-serif" font-size="28" font-weight="500" fill="#3d2b1f">strix-blog.uk</text>

  <!-- Right-band big S -->
  <text x="1050" y="385" font-family="Georgia, 'Source Serif 4', serif" font-size="280" font-weight="700" fill="#fff" text-anchor="middle" opacity="0.92">S</text>
</svg>
